{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Footy</title>
    <link rel="stylesheet" href="{% static 'css/index.css'%}">
</head>
<body>
    <h1>Hello footy fans !!!!!!!</h1>

    <div id="container">
        {% if message %}
            <p>{{ message }}</p>
        {% endif %}

        {% if error %}
            <p>{{ error }}</p>
        {% endif %}

        {% if player %}
            <h2>{{ player.name }}</h2>
            <p>{{ player.nationality }}</p>

            <img src="{{ player.photo }}" width="200">
        {% endif %}
    </div>

    <div id="updater">
        <form method="post">
            {% csrf_token %}
            <input type="text"placeholder="Player Name:" name="player_search">
            <button type="submit">Check</button>
        </form>
    </div>
</body>
</html>
